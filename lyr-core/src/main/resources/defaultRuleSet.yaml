# Syntax:
# - scan.<service>.<resource>.<check>: <parameters>
scan.glue.session.activeWithLongIdleTimeout:
  maxIdleTimeoutInMinutes: 15
scan.dynamodb.table.idle:
  maxIdlePeriodInDays: 30
  excludeEmptyTables: false
scan.dynamodb.table.withoutBackup:
  passIfPitrEnabled: true
  passIfBackupPlanEnabled: true
scan.lambda.function.withUnboundedConcurrency:
scan.lambda.function.withXrayTracingNotEnabled:
scan.lambda.function.withDisallowedArchitecture:
  disallowedArchitecture: x86_64
scan.lambda.function.withoutAnyActiveTrigger:
  triggerStatesConsideredAsActive: ["creating", "enabling", "enabled", "updating"]
scan.cloudwatch.logGroup.withoutRetentionPolicy: